[package]
name = "ironkeys"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Key custody for the IronSecurity stack: one interface over software, HSM, TPM and cloud keys"
repository = "https://github.com/nervosys/IronKeys"
readme = "README.md"
keywords = ["cryptography", "hsm", "pkcs11", "tpm", "kms"]
categories = ["cryptography", "no-std"]

[workspace]
members = [
    "crates/ironkeys-pkcs11",
    "crates/ironkeys-cng",
    "crates/ironkeys-tpm2",
    "crates/ironkeys-kms",
]

[dependencies]
# The signing interface and custody classes come from IronCrypto.
# 0.2.24 is the first release with the ProviderUnavailable and
# ProviderRefused error kinds the device providers report.
ic-core = { version = ">=0.2.24, <0.3", default-features = false }
# In-memory keys: IronCrypto's signer, first released in 0.2.21.
ic-sig = { version = ">=0.2.21, <0.3", default-features = false, optional = true }
# The PKCS#11 provider: the native boundary, and IronCrypto for the digest,
# point validation and signature encoding around it.
ironkeys-pkcs11 = { path = "crates/ironkeys-pkcs11", version = "0.1.0", optional = true }
# The TPM 2.0 provider: the native command layer with its device transports.
ironkeys-tpm2 = { path = "crates/ironkeys-tpm2", version = "0.1.0", features = ["device"], optional = true }
# The AWS KMS provider: the client, with its TLS and bundled roots.
ironkeys-kms = { path = "crates/ironkeys-kms", version = "0.1.2", optional = true }
ic-ec = { version = ">=0.2.21, <0.3", optional = true }
ic-hash = { version = ">=0.2.21, <0.3", optional = true }
ic-pkix = { version = ">=0.2.21, <0.3", optional = true }

# The Windows CNG provider: the native boundary to the Platform Crypto
# Provider.
[target.'cfg(windows)'.dependencies]
ironkeys-cng = { path = "crates/ironkeys-cng", version = "0.1.0", optional = true }

# The software provider's tests build a key and verify what it signs.
[dev-dependencies]
ic-pkix = { version = ">=0.2.21, <0.3" }
ic-drbg = { version = ">=0.2.21, <0.3", features = ["std"] }
ic-ec = { version = ">=0.2.21, <0.3" }
ic-sig = { version = ">=0.2.21, <0.3" }
# The KMS provider's tests run a mock KMS that reads the requests.
ic-json = { version = ">=0.2.21, <0.3" }
ic-hash = { version = ">=0.2.21, <0.3" }

[features]
default = ["std"]
std = ["ic-core/std", "ic-sig?/std"]
# The software provider: keys held in this process's memory.
software = ["dep:ic-sig"]
# The PKCS#11 provider: P-384 keys in an HSM or token.
pkcs11 = ["std", "dep:ironkeys-pkcs11", "dep:ic-ec", "dep:ic-hash", "dep:ic-pkix"]
# The TPM 2.0 provider: P-384 keys wrapped by a TPM's storage root.
tpm2 = ["std", "dep:ironkeys-tpm2", "dep:ic-ec", "dep:ic-hash", "dep:ic-pkix"]
# The AWS KMS provider: P-384 keys that stay in AWS KMS.
kms = ["std", "dep:ironkeys-kms", "dep:ic-ec", "dep:ic-hash", "dep:ic-pkix"]
# The Windows CNG provider: P-384 keys persisted in the machine's TPM by the
# Platform Crypto Provider. Builds nothing on other systems.
cng = ["std", "dep:ironkeys-cng", "dep:ic-ec", "dep:ic-hash", "dep:ic-pkix"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
