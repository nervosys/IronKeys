[package]
name = "ironkeys-kms"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "An AWS KMS client in safe Rust for IronKeys: credentials, SigV4 and the key operations over IronSocketLayer"
repository = "https://github.com/nervosys/IronKeys"
readme = "README.md"
keywords = ["cryptography", "ironsecurity"]
categories = ["cryptography"]

[dependencies]
ic-core = { version = ">=0.3.1, <0.4" }
ic-ec = { version = ">=0.3.1, <0.4" }
ic-hash = { version = ">=0.3.1, <0.4" }
ic-json = { version = ">=0.3.1, <0.4" }
ic-mac = { version = ">=0.3.1, <0.4" }
# The TLS 1.3 client the requests travel over.
ironsocketlayer = { version = "0.7.0" }

[lints.rust]
unsafe_code = "forbid"
