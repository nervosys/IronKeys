[package]
name = "ironkeys-tpm2"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "A native TPM 2.0 layer in safe Rust for IronKeys: marshalling, sessions and commands"
repository = "https://github.com/nervosys/IronKeys"
publish = false

[dependencies]
ic-core = { version = ">=0.2.21, <0.3" }
ic-cipher = { version = ">=0.2.21, <0.3" }
ic-drbg = { version = ">=0.2.21, <0.3", features = ["std"] }
ic-ec = { version = ">=0.2.21, <0.3" }
ic-hash = { version = ">=0.2.21, <0.3" }
ic-mac = { version = ">=0.2.21, <0.3" }
ic-rsa = { version = ">=0.2.21, <0.3" }

[target.'cfg(windows)'.dependencies]
ironkeys-cng = { path = "../ironkeys-cng", version = "0.0.0", optional = true }

[features]
# The command layer and transports to a device: Windows TBS, a Linux TPM
# resource manager, or a swtpm socket. Without it, only the structures and
# software operations a verifier needs are built.
device = ["dep:ironkeys-cng"]

[lints.rust]
unsafe_code = "forbid"
